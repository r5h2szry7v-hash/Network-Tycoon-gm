name: Story campaign preview
on:
  push:
    branches:
      - feat/story-chapter-experience

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage game preview
        run: |
          mkdir -p public/tycoon
          cp index.html public/tycoon/index.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path("public/tycoon/index.html")
          html = page.read_text()
          link = '<link rel="stylesheet" href="/disable-text-selection.css">'
          if link not in html:
              html = html.replace("</head>", link + "</head>", 1)
          page.write_text(html)
          PY
      - name: Prepare preview version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          version = "${{ github.sha }}"
          Path("public/version.json").write_text(json.dumps({"version": version}) + "\n")
          worker = Path("public/service-worker.js")
          source = worker.read_text().replace("__DEPLOYMENT_VERSION__", version)
          worker.write_text(source)
          script = '<script src="/update-manager.js" defer></script>'
          for page in Path("public").rglob("*.html"):
              html = page.read_text()
              if script not in html:
                  html = html.replace("</head>", script + "</head>", 1)
                  page.write_text(html)
          PY
      - name: Deploy expiring Firebase preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NETWORK_TYCOON_GM }}
          projectId: network-tycoon-gm
          channelId: story-chapters-preview
          expires: 7d
          disableComment: true
