name: Preview portfolio shell branch

on:
  push:
    branches:
      - feature/portfolio-game-shell
      - feature/shared-pwa-update-manager
      - feature/tinker-parts-store
      - feat/pawprint-pursuit-prototype
      - feat/pawprint-reactions
      - feat/pawprint-prize-feedback
      - feat/mobile-map-first-pinch
      - feat/map-touch-pan
      - feat/tycoon-companions
      - feat/tycoon-companions-review
      - feat/tycoon-companions-preview
      - feat/tycoon-companions-motion
      - feat/tycoon-companions-phase2
      - feat/portfolio-companion-layer
      - feat/companion-layer-match-garden

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage Network Tycoon under its game route
        run: |
          mkdir -p public/tycoon
          cp index.html public/tycoon/index.html
          python3 - <<'PY'
          from pathlib import Path
          page = Path("public/tycoon/index.html")
          html = page.read_text()
          link = '<link rel="stylesheet" href="/disable-text-selection.css">'
          if link not in html:
              page.write_text(html.replace("</head>", link + "</head>", 1))
          PY
          python3 - <<'PY'
          from pathlib import Path
          page = Path("public/tycoon/index.html")
          html = page.read_text()
          nav_css = """<style>
          .cross-game-links{display:flex;justify-content:flex-end;gap:8px;margin:0 0 10px}
          .cross-game-links a,.setup-nav a{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border:1px solid #cfe0d8;border-radius:10px;background:#f7fffb;color:#267568;text-decoration:none;font:800 12px system-ui,sans-serif}
          .setup-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
          .setup-nav .setup-back{margin:0}
          .game-home-menu{position:relative;z-index:100;display:inline-block}
          .game-home-menu summary{list-style:none;cursor:pointer;white-space:nowrap;border:1px solid #57717e;border-radius:10px;background:#285061;color:#fff;padding:8px 10px;font:800 12px system-ui,sans-serif}
          .game-home-menu summary::-webkit-details-marker{display:none}
          .game-home-menu-list{display:none;position:absolute;top:calc(100% + 6px);left:0;min-width:145px;padding:6px;border:1px solid #dbe5e6;border-radius:12px;background:#fff;box-shadow:0 12px 28px #102b3a30}
          .game-home-menu[open] .game-home-menu-list{display:grid;gap:3px}
          .game-home-menu-list a{display:block;padding:9px 10px;border-radius:8px;color:#173143;text-decoration:none;font:800 12px system-ui,sans-serif;white-space:nowrap}
          .game-home-menu-list a:hover{background:#edf7f3}
          @media(max-width:700px){.game-home-menu summary{padding:7px 8px;font-size:11px}}
          </style>"""
          if 'class="game-home-menu"' not in html:
              html = html.replace("</head>", nav_css + "</head>", 1)
              html = html.replace('<div class="setup-card home-card">', '<div class="setup-card home-card"><nav class="cross-game-links"><a href="/">← All games</a></nav>', 1)
              html = html.replace('<button id="setup-back" class="setup-back" type="button">← Home</button>', '<nav class="setup-nav"><button id="setup-back" class="setup-back" type="button">← Tycoon home</button><a href="/">All games</a></nav>', 1)
              html = html.replace('<div class="top-actions">', '<div class="top-actions"><details class="game-home-menu"><summary>⌂ Home</summary><div class="game-home-menu-list"><a href="/tycoon/">Tycoon home</a><a href="/">All games</a></div></details>', 1)
          login_nav = '<nav class="cross-game-links"><a href="/">← All games</a></nav>'
          login_nav_with_button = '<nav class="cross-game-links"><a href="/">← All games</a><button type="button" class="cloud-home-login" data-cloud-login><span data-cloud-label>☁ Log in to sync</span></button></nav>'
          if 'data-cloud-login' not in html:
              html = html.replace(login_nav, login_nav_with_button, 1)
          tag = '<script type="module">import { startCloudSync } from "/cloud-save.js?v=portfolio-cloud-v1"; startCloudSync("networkTycoon");</script>'
          if tag not in html:
              html = html.replace("</body>", tag + "</body>", 1)
              page.write_text(html)
          PY
      - name: Enable touch panning on the map
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("public/tycoon/index.html")
          html = page.read_text()
          script = '<script src="/map-touch-pan.js" defer></script>'
          if script not in html:
              html = html.replace("</head>", script + "</head>", 1)
              page.write_text(html)
          PY
      - name: Add Network Tycoon character companions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          page = Path("public/tycoon/index.html")
          html = page.read_text()
          script = '<script src="/tycoon-companions.js" defer></script>'
          if script not in html:
              html = html.replace("</head>", script + "</head>", 1)
              page.write_text(html)
          PY
      - name: Prepare shared PWA release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          version = "${{ github.sha }}"
          Path("public/version.json").write_text(json.dumps({"version": version}) + "\n")
          worker = Path("public/service-worker.js")
          source = worker.read_text()
          if "__DEPLOYMENT_VERSION__" not in source:
              raise SystemExit("Service worker deployment version token is missing.")
          worker.write_text(source.replace("__DEPLOYMENT_VERSION__", version))
          script = '<script src="/update-manager.js" defer></script>'
          for page in Path("public").rglob("*.html"):
              html = page.read_text()
              if script not in html:
                  if "</head>" not in html.lower():
                      raise SystemExit(f"Page has no head close tag: {page}")
                  offset = html.lower().rfind("</head>")
                  html = html[:offset] + script + html[offset:]
                  page.write_text(html)
          PY
      - name: Validate PWA release artifacts
        run: |
          node --check public/update-manager.js
          node --check public/tycoon-companions.js
          node --check public/service-worker.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          config = json.loads(Path("firebase.json").read_text())
          version = json.loads(Path("public/version.json").read_text())
          assert version["version"] and len(version["version"]) >= 7
          worker = Path("public/service-worker.js").read_text()
          assert "__DEPLOYMENT_VERSION__" not in worker
          assert version["version"] in worker
          pages = list(Path("public").rglob("*.html"))
          assert pages, "No portfolio pages found"
          missing = [str(page) for page in pages if '<script src="/update-manager.js" defer></script>' not in page.read_text()]
          assert not missing, "Update manager missing from: " + ", ".join(missing)
          assert any(header.get("source") == "service-worker.js" for header in config["hosting"]["headers"])
          print(f"Validated {len(pages)} portfolio pages for release {version['version']}.")
          PY
      - name: Deploy temporary Firebase Hosting preview
        id: deploy_preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NETWORK_TYCOON_GM }}
          projectId: network-tycoon-gm
          channelId: map-review
          expires: 7d
          disableComment: true
      - name: Add preview URL to workflow summary
        env:
          PREVIEW_URL: ${{ steps.deploy_preview.outputs.details_url }}
        run: |
          echo "Preview URL: $PREVIEW_URL" >> "$GITHUB_STEP_SUMMARY"
