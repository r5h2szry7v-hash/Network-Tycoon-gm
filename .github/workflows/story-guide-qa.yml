name: Network Tycoon PR Preview
on:
  push:
    branches:
      - feat/story-chapter-experience
    paths:
      - index.html
      - .github/workflows/story-guide-qa.yml
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage Network Tycoon route
        run: |
          mkdir -p public/tycoon
          cp index.html public/tycoon/index.html
      - name: Deploy PR #48 Firebase preview
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NETWORK_TYCOON_GM }}
          projectId: network-tycoon-gm
          channelId: story-chapters-preview
          expires: 7d
          disableComment: true
